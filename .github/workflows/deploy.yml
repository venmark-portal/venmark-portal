name: Deploy

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Miljø at deploye til'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy produktion (main)
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KE }}
          script: |
            set -e
            cd /var/www/venmark
            # Direkte edits på serveren må ikke kunne blokere et deploy (jf. CLAUDE.md).
            # De gemmes i stash og kan hentes frem igen med `git stash list`.
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "⚠ lokale ændringer på serveren — gemmer i stash før pull"
              git stash push -m "auto-stash før deploy $(date -Is)"
            fi
            git pull origin main
            # IKKE --omit=dev — se noten i test-jobbet: buildet kræver devDependencies.
            if git diff HEAD@{1} --name-only | grep -q 'package\.json\|package-lock\.json'; then
              npm install
            fi
            set -a && source .env.local && set +a
            # Idempotent skema-selvhelbredelse: sikrer nye kolonner findes FØR prisma generate,
            # så den genererede klient aldrig SELECTer en kolonne DB'en mangler (ville vælte logins).
            echo 'ALTER TABLE "Customer" ADD COLUMN IF NOT EXISTS "bcChainPriceGroup" TEXT;' | npx prisma db execute --schema prisma/schema.prisma --stdin
            npx prisma generate
            npm run build
            pm2 restart venmark
            echo "✅ Produktion deployet"

      - name: Deploy test (staging)
        if: github.ref == 'refs/heads/staging' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KE }}
          script: |
            set -e
            cd /var/www/venmark-test
            # Direkte edits på serveren må ikke kunne blokere et deploy (jf. CLAUDE.md).
            # De gemmes i stash og kan hentes frem igen med `git stash list`.
            if ! git diff --quiet || ! git diff --cached --quiet; then
              echo "⚠ lokale ændringer på serveren — gemmer i stash før pull"
              git stash push -m "auto-stash før deploy $(date -Is)"
            fi
            git pull origin staging
            # IKKE --omit=dev: `next build` kræver devDependencies (typescript,
            # tailwindcss, postcss). Uden typescript kan Next ikke læse "paths" fra
            # tsconfig.json, og så fejler hvert eneste @/-import med "Module not found".
            npm install
            set -a && source .env.local && set +a
            # Idempotent skema-selvhelbredelse (se prod-trin).
            echo 'ALTER TABLE "Customer" ADD COLUMN IF NOT EXISTS "bcChainPriceGroup" TEXT;' | npx prisma db execute --schema prisma/schema.prisma --stdin
            npx prisma generate
            npm run build
            # BEMÆRK: ecosystem.config.js i repoet er PROD-konfigurationen (venmark, port
            # 3000, /var/www/venmark). Testmiljøets egen ligger som ecosystem.test.config.js
            # på serveren (venmark-test, port 3002) — ellers ville en fallback her starte
            # en dublet af prod.
            pm2 restart venmark-test || pm2 start /var/www/venmark-test/ecosystem.test.config.js
            echo "✅ Test deployet"
